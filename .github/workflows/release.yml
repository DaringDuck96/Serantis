name: Release

# Push a tag like v0.1.0 and this builds Serantis-0.1.0.zip and publishes it as a GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          zip -r "Serantis-${VERSION}.zip" mods README.md
          echo "ZIP=Serantis-${VERSION}.zip" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --title "Serantis $GITHUB_REF_NAME" \
            --notes "Download **$ZIP**, unzip it, and copy every \`.jar\` from its \`mods\` folder into your \`.minecraft/mods\` folder. Full steps are in the README."
