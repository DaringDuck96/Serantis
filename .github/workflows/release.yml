name: Release

# Whenever the mods, README or VERSION change on main, this builds Serantis-<VERSION>.zip
# and publishes it as a GitHub Release. To ship an update: swap the jars in mods/,
# bump the number in VERSION, and push. It can also be run by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "mods/**"
      - "README.md"
      - "VERSION"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          zip -r "Serantis-${VERSION}.zip" mods README.md
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "ZIP=Serantis-${VERSION}.zip" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          NOTES="Download **${ZIP}**, unzip it, and copy every \`.jar\` from its \`mods\` folder into your \`.minecraft/mods\` folder. Full steps are in the README."
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Same version pushed again: replace the zip so the download is always current.
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" --title "Serantis $TAG" --notes "$NOTES" --latest
          fi
