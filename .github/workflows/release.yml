name: Release

# Whenever the mods, add-ons, README or VERSION change on main, this builds Serantis-<VERSION>.zip
# and publishes it as a GitHub Release. Each folder in addons/ is packed into its own mod jar
# (named from its fabric.mod.json) and added to the mods folder of the download.
# To ship an update: change mods/ or addons/, bump the number in VERSION, and push.
# It can also be run by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "mods/**"
      - "addons/**"
      - "tools/compile-stubs/**"
      - "README.md"
      - "VERSION"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Add-ons with a src/ folder contain Java code; it is compiled against the real creatures mod.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # Minecraft 26.x jars use Mojang's own names, so add-on code can compile straight against them.
      - name: Fetch Minecraft and its libraries for compiling add-on code
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/mc"
          manifest="$(curl -sSf https://piston-meta.mojang.com/mc/game/version_manifest_v2.json)"
          vurl="$(echo "$manifest" | jq -r '[.versions[] | select(.id | test("^26\\.3(\\.[0-9]+)?$"))][0].url')"
          curl -sSf "$vurl" -o "$RUNNER_TEMP/version.json"
          echo "Minecraft $(jq -r .id "$RUNNER_TEMP/version.json")"
          curl -sSfL "$(jq -r .downloads.client.url "$RUNNER_TEMP/version.json")" -o "$RUNNER_TEMP/mc/minecraft.jar"
          jq -r '.libraries[] | .downloads.artifact.url // empty' "$RUNNER_TEMP/version.json" | sort -u | while read -r u; do
            curl -sSfL "$u" -o "$RUNNER_TEMP/mc/$(basename "$u")"
          done
          echo "MC_CP=$(ls "$RUNNER_TEMP"/mc/*.jar | tr '\n' ':')" >> "$GITHUB_ENV"

      - name: Build add-on jars
        run: |
          set -e
          CREATURES="$(ls mods/ahrivaea-creatures-*.jar)"
          for dir in addons/*/; do
            [ -f "$dir/fabric.mod.json" ] || continue
            name="$(basename "$dir")"
            ver="$(jq -r .version "$dir/fabric.mod.json")"
            jar="$GITHUB_WORKSPACE/mods/${name}-${ver}.jar"
            (cd "$dir" && zip -qr "$jar" . -x '*.md' -x 'src/*')
            if [ -d "$dir/src" ]; then
              classes="$(mktemp -d)"
              if ! javac --release 25 -implicit:none -proc:none -Xlint:-options -d "$classes" \
                -cp "$CREATURES:$MC_CP" -sourcepath tools/compile-stubs $(find "$dir/src" -name '*.java') 2> "$RUNNER_TEMP/javac.txt"; then
                # Surface compiler errors as annotations so they show on the run page.
                grep -E "error:" "$RUNNER_TEMP/javac.txt" | head -10 | while read -r l; do echo "::error title=javac ($name)::$l"; done
                cat "$RUNNER_TEMP/javac.txt"
                exit 1
              fi
              (cd "$classes" && zip -qr "$jar" .)
            fi
            echo "built mods/${name}-${ver}.jar"
            unzip -l "$jar" | tail -1
          done

      - name: Build zip
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          zip -r "Serantis-${VERSION}.zip" mods README.md
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "ZIP=Serantis-${VERSION}.zip" >> "$GITHUB_ENV"

      # Shows up as a download at the bottom of this run's page in the Actions tab.
      - name: Upload mods as a download on the Actions run
        uses: actions/upload-artifact@v4
        with:
          name: Serantis-${{ env.VERSION }}
          path: |
            mods/
            README.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          NOTES="Download **${ZIP}**, unzip it, and copy every \`.jar\` from its \`mods\` folder into your \`.minecraft/mods\` folder. Full steps are in the README."
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Same version pushed again: replace the zip so the download is always current.
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" --title "Serantis $TAG" --notes "$NOTES" --latest
          fi
