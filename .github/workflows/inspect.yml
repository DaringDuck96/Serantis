name: Inspect

# Tooling only (branch "inspect"). For each line of inspect/classes.txt:
#   a.b.C          full disassembly (javap -c) of the class and its nested classes
#   sig:a.b.C      member signatures only (javap -p), for very large classes
#   find:regex     list class files (in every jar) whose path matches the regex, into find.txt
#   asset:path     copy that file out of the Minecraft jar (e.g. assets/minecraft/textures/item/bucket.png)
# Classes are looked up in Minecraft 26.3 and in Fabric API (all its modules). Output -> inspect/out/.
on:
  push:
    branches: [inspect]
    paths: ["inspect/classes.txt", ".github/workflows/inspect.yml"]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Fetch Minecraft and Fabric API
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/mc" "$RUNNER_TEMP/fapi"
          manifest="$(curl -sSf https://piston-meta.mojang.com/mc/game/version_manifest_v2.json)"
          vurl="$(echo "$manifest" | jq -r '[.versions[] | select(.id | test("^26\\.3(\\.[0-9]+)?$"))][0].url')"
          curl -sSf "$vurl" -o "$RUNNER_TEMP/version.json"
          curl -sSfL "$(jq -r .downloads.client.url "$RUNNER_TEMP/version.json")" -o "$RUNNER_TEMP/mc/minecraft.jar"
          meta="$(curl -sSf https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml)"
          fv="$(echo "$meta" | grep -oE '<version>[^<]*\+26\.3[^<]*</version>' | sed -E 's#</?version>##g' | tail -1)"
          echo "Fabric API $fv"
          curl -sSfL "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$fv/fabric-api-$fv.jar" -o "$RUNNER_TEMP/fapi/fabric-api.jar"
          cd "$RUNNER_TEMP/fapi" && unzip -qo fabric-api.jar 'META-INF/jars/*' && ls META-INF/jars | head -80
          echo "$fv" > "$GITHUB_WORKSPACE/inspect/fabric-api-version.txt"
      - name: Disassemble
        run: |
          set -e
          rm -rf inspect/out && mkdir -p inspect/out
          JARS="$RUNNER_TEMP/mc/minecraft.jar $(ls $RUNNER_TEMP/fapi/META-INF/jars/*.jar | tr '\n' ' ')"
          CP="$(echo $JARS | tr ' ' ':')"
          grep -v '^#' inspect/classes.txt | while read -r line; do
            [ -n "$line" ] || continue
            case "$line" in
              find:*) pat="${line#find:}"; for jar in $JARS; do unzip -Z1 "$jar" | grep -E '\.class$' | grep -E "$pat" | sed "s#^#$(basename $jar): #"; done >> inspect/out/find.txt; continue;;
              asset:*) p="${line#asset:}"; unzip -p "$RUNNER_TEMP/mc/minecraft.jar" "$p" > "inspect/out/$(echo "$p" | tr / _)" || true; continue;;
              sig:*) c="${line#sig:}"; flags="-p -constants";;
              *) c="$line"; flags="-c -p -constants";;
            esac
            for jar in $JARS; do
              p="$(echo "$c" | tr . /)"; p="${p//\$/\\\$}"
              for n in $(unzip -Z1 "$jar" | grep -E "^${p}(\\\$[^/]*)?\\.class$" | sed 's/\.class$//' | tr / .); do
                javap $flags -cp "$CP" "$n" > "inspect/out/$n.txt" || true
              done
            done
          done
          ls inspect/out
      - name: Compile the add-ons from main (when classes.txt has a "compile" line)
        run: |
          L=$(grep -E '^compile( |$)' inspect/classes.txt | head -1) || exit 0
          REF=$(echo "$L" | awk '{print $2}'); REF=${REF:-main}
          mkdir -p inspect/out
          git fetch -q origin "$REF"
          M="$RUNNER_TEMP/main"; mkdir -p "$M"
          git archive FETCH_HEAD | tar -x -C "$M"
          jq -r '.libraries[] | .downloads.artifact.url // empty' "$RUNNER_TEMP/version.json" | sort -u | while read -r u; do
            curl -sSfL "$u" -o "$RUNNER_TEMP/mc/$(basename "$u")"
          done
          MC_CP="$(ls "$RUNNER_TEMP"/mc/*.jar | tr '\n' ':')"
          CREATURES="$(ls $M/mods/ahrivaea-creatures-*.jar)"
          ORIGINALS="$(ls $M/mods/ahrivaea-*.jar | grep -v creatures | tr '\n' ':')"
          for dir in $M/addons/*/; do
            [ -d "$dir/src" ] || continue
            name="$(basename "$dir")"
            classes="$(mktemp -d)"
            javac --release 25 -implicit:none -proc:none -Xlint:-options -d "$classes" \
              -cp "$CREATURES:$ORIGINALS$MC_CP" -sourcepath $M/tools/compile-stubs $(find "$dir/src" -name '*.java') > "inspect/out/javac-$name.txt" 2>&1 \
              && echo OK >> "inspect/out/javac-$name.txt" || true
          done
          ls inspect/out
      - name: Decompile a mod jar from main (lines "decompile:<jar glob> <package path prefix>")
        run: |
          grep -E '^decompile:' inspect/classes.txt || exit 0
          curl -sSfL https://repo1.maven.org/maven2/org/vineflower/vineflower/1.10.1/vineflower-1.10.1.jar -o "$RUNNER_TEMP/vf.jar"
          git fetch -q origin main
          D="$RUNNER_TEMP/dmain"; mkdir -p "$D"
          git archive FETCH_HEAD mods | tar -x -C "$D"
          grep -E '^decompile:' inspect/classes.txt | while read -r line; do
            spec="${line#decompile:}"; glob="$(echo "$spec" | awk '{print $1}')"; pre="$(echo "$spec" | awk '{print $2}')"
            x="$(mktemp -d)"
            for jar in $(ls $D/mods/$glob); do (cd "$x" && unzip -qo "$jar" "$pre*" 2>/dev/null || true); done
            o="$(mktemp -d)"
            java -jar "$RUNNER_TEMP/vf.jar" -dgs=1 -log=WARN "$x" "$o" > /dev/null 2>&1 || true
            mkdir -p inspect/out/decomp && cp -r "$o"/. inspect/out/decomp/
          done
          find inspect/out/decomp -name '*.java' | head -100
      - name: Boot a dedicated server with the latest release (lines "smoke")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -qE '^smoke' inspect/classes.txt || exit 0
          set -x
          mkdir -p inspect/out
          S="$RUNNER_TEMP/server"; mkdir -p "$S/mods"
          url="$(gh api repos/${{ github.repository }}/releases/latest --jq '.assets[0].url')"
          gh api -H "Accept: application/octet-stream" "$url" > "$RUNNER_TEMP/rel.zip"
          (cd "$RUNNER_TEMP" && unzip -qo rel.zip -d relx)
          cp "$RUNNER_TEMP"/relx/mods/*.jar "$S/mods/"
          ls "$S"/mods/fabric-api-*.jar >/dev/null 2>&1 || cp "$RUNNER_TEMP/fapi/fabric-api.jar" "$S/mods/"
          git fetch -q origin main; St="$RUNNER_TEMP/stubs"; mkdir -p "$St"; git archive FETCH_HEAD tools/compile-stubs | tar -x -C "$St"
          SC="$(mktemp -d)"; javac --release 25 -d "$SC" -sourcepath "$St/tools/compile-stubs" tools/smoke/src/serantis/smoke/SmokeInit.java
          rm -rf "$SC/net"; cp tools/smoke/fabric.mod.json "$SC/"; (cd "$SC" && jar cf "$S/mods/serantis-smoke.jar" .)
          MCV="$(jq -r .id "$RUNNER_TEMP/version.json")"
          LV="$(curl -sSf https://meta.fabricmc.net/v2/versions/loader/$MCV | jq -r '.[0].loader.version')"
          IV="$(curl -sSf https://meta.fabricmc.net/v2/versions/installer | jq -r '.[0].version')"
          curl -sSfL "https://meta.fabricmc.net/v2/versions/loader/$MCV/$LV/$IV/server/jar" -o "$S/server.jar"
          cd "$S"; echo "eula=true" > eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:normal\nview-distance=4\nsimulation-distance=4\nspawn-protection=0\n' > server.properties
          ( sleep 1; until grep -q 'Done (' logs/latest.log 2>/dev/null; do sleep 5; if ! pgrep -f server.jar >/dev/null; then break; fi; done; sleep 20; echo stop ) | timeout 900 java -Xmx3G -jar server.jar nogui > console.txt 2>&1 || true
          cp console.txt "$GITHUB_WORKSPACE/inspect/out/smoke-console.txt"
          grep -nE 'SMOKE|ERROR|Exception|Caused by|Mixin.*(fail|error)|InvalidInjection|InjectionError|Critical|Done \(' console.txt | head -300 > "$GITHUB_WORKSPACE/inspect/out/smoke-summary.txt" || true
      - name: Launch a real client under a virtual display (lines "clientsmoke")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -qE '^clientsmoke' inspect/classes.txt || exit 0
          set -x
          mkdir -p inspect/out
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libgl1 libegl1 libegl-mesa0 mesa-utils x11-utils > /dev/null
          pip install -q portablemc
          C="$RUNNER_TEMP/client"; mkdir -p "$C/mods"
          url="$(gh api repos/${{ github.repository }}/releases/latest --jq '.assets[0].url')"
          gh api -H "Accept: application/octet-stream" "$url" > "$RUNNER_TEMP/relc.zip"
          (cd "$RUNNER_TEMP" && unzip -qo relc.zip -d relc)
          cp "$RUNNER_TEMP"/relc/mods/*.jar "$C/mods/"
          ls "$C"/mods/fabric-api-*.jar >/dev/null 2>&1 || cp "$RUNNER_TEMP/fapi/fabric-api.jar" "$C/mods/"
          git fetch -q origin main; St="$RUNNER_TEMP/stubs2"; mkdir -p "$St"; git archive FETCH_HEAD tools/compile-stubs | tar -x -C "$St"
          SC="$(mktemp -d)"; javac --release 25 -d "$SC" -sourcepath "$St/tools/compile-stubs" tools/smoke/src/serantis/smoke/SmokeInit.java
          rm -rf "$SC/net"; cp tools/smoke/fabric.mod.json "$SC/"; (cd "$SC" && jar cf "$C/mods/serantis-smoke.jar" .)
          ls "$C/mods"
          MCV="$(jq -r .id "$RUNNER_TEMP/version.json")"
          export LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=4.5 MESA_GLSL_VERSION_OVERRIDE=450 SDL_VIDEO_FORCE_EGL=1 SDL_VIDEO_X11_FORCE_EGL=1 SDL_VIDEO_EGL_DRIVER=libEGL.so.1 SDL_VIDEO_GL_DRIVER=libGL.so.1
          glxinfo -B > inspect/out/glxinfo.txt 2>&1 || true
          (portablemc --help; portablemc start --help) > inspect/out/pmc-help.txt 2>&1 || true
          ( timeout 900 xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" portablemc --main-dir "$C" start "fabric:$MCV" > "$RUNNER_TEMP/client-console.txt" 2>&1 & )
          for i in $(seq 1 160); do
            sleep 5
            if grep -qE 'Created: .*textures|Sound engine started|SMOKE: mixin audit (finished|FAILED)' "$C/logs/latest.log" 2>/dev/null && grep -q 'Sound engine started\|Reloading ResourceManager' "$C/logs/latest.log" 2>/dev/null; then sleep 45; break; fi
            if [ -n "$(ls "$C"/crash-reports 2>/dev/null)" ]; then break; fi
          done
          pkill -f portablemc || true; pkill -f java || true; sleep 3
          cp "$RUNNER_TEMP/client-console.txt" inspect/out/client-console.txt || true
          cp "$C/logs/latest.log" inspect/out/client-latest.log 2>/dev/null || true
          mkdir -p inspect/out/client-crash; cp "$C"/crash-reports/* inspect/out/client-crash/ 2>/dev/null || true
          grep -nE 'SMOKE|ERROR|Exception|Caused by|Mixin.*(fail|error)|InvalidInjection|InjectionError|Critical|Sound engine|Reloading ResourceManager|OpenGL' "$C/logs/latest.log" "$RUNNER_TEMP/client-console.txt" 2>/dev/null | head -300 > inspect/out/client-summary.txt || true
      - name: Commit output
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add inspect
          git commit -m "Inspect output [skip ci]" || true
          git push
