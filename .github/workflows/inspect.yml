name: Inspect

# Tooling only (branch "inspect"): disassembles the Minecraft classes listed in inspect/classes.txt
# with javap and commits the output to inspect/out/, so add-on code can be checked against the
# real Minecraft 26.3 names before it ships.
on:
  push:
    branches: [inspect]
    paths: ["inspect/classes.txt"]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Fetch Minecraft
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/mc"
          manifest="$(curl -sSf https://piston-meta.mojang.com/mc/game/version_manifest_v2.json)"
          vurl="$(echo "$manifest" | jq -r '[.versions[] | select(.id | test("^26\\.3(\\.[0-9]+)?$"))][0].url')"
          curl -sSf "$vurl" -o "$RUNNER_TEMP/version.json"
          curl -sSfL "$(jq -r .downloads.client.url "$RUNNER_TEMP/version.json")" -o "$RUNNER_TEMP/mc/minecraft.jar"
      - name: Disassemble
        run: |
          set -e
          rm -rf inspect/out && mkdir -p inspect/out
          JAR="$RUNNER_TEMP/mc/minecraft.jar"
          grep -v '^#' inspect/classes.txt | while read -r c; do
            [ -n "$c" ] || continue
            # every nested class too (anonymous slots and the like)
            for n in $(unzip -Z1 "$JAR" | grep -E "^${c//.//}(\\\$[^/]*)?\\.class$" | sed 's/\.class$//' | tr / .); do
              javap -c -p -constants -cp "$JAR" "$n" > "inspect/out/$n.txt" || true
            done
          done
          ls inspect/out
      - name: Commit output
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add inspect/out
          git commit -m "Inspect output [skip ci]" || true
          git push
